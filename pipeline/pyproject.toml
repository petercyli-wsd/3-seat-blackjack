[project]
name = "bj3-pipeline"
version = "0.1.0"
description = "Footage analysis, trimming and compositing assets for the 3-seat blackjack prototype"
requires-python = ">=3.11"
dependencies = [
  "opencv-python-headless>=4.10",
  "numpy>=2.0",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# the landing pass (bj3.landing): SAM 2 video segmentation, on the CPU
sam = ["torch>=2.5", "sam2>=1.1"]

[tool.uv]
package = false
